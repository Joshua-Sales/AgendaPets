<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgendaPets - Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🐾 AgendaPets</h1>

        <!-- Seção de Login -->
        <div class="card" id="login-section">
            <h2>Entrar</h2>
            <input type="email" id="email" placeholder="Seu E-mail">
            <input type="password" id="senha" placeholder="Sua Senha">
            <button onclick="fazerLogin()">Login</button>
            <button onclick="mostrarCadastro()" style="background-color: #2ecc71;">Criar Nova Conta</button>
            <button onclick="testarConexao()" style="background-color: #9b59b6;">Testar Conexão com Banco</button>
        </div>

        <!-- Seção de Cadastro (escondida por padrão) -->
        <div class="card" id="register-section" style="display: none;">
            <h2>Novo Cadastro</h2>
            <input type="text" id="reg-nome" placeholder="Seu Nome">
            <input type="email" id="reg-email" placeholder="Seu E-mail">
            <input type="text" id="reg-telefone" placeholder="Seu Telefone">
            <input type="password" id="reg-senha" placeholder="Sua Senha">
            <select id="reg-role" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #444; background-color: #2d2d2d; color: #ffffff; border-radius: 4px;">
                <option value="tutor">Sou Tutor</option>
                <option value="veterinario">Sou Veterinário</option>
            </select>
            <button onclick="fazerCadastro()">Cadastrar</button>
            <button onclick="mostrarLogin()" style="background-color: #7f8c8d;">Voltar para Login</button>
        </div>

        <!-- Seção do Painel (escondida até logar) -->
        <div class="card" id="painel-section" style="display: none;">
            <h2>Bem-vindo!</h2>
            <button onclick="verMeuPerfil()">Ver Meu Perfil</button>            
            <button id="btn-ver-agendamentos-tutor" onclick="fazerRequisicao('/agendamentos')" style="display: none;">Meus Agendamentos</button>
            <button id="btn-ver-agendamentos-veterinario" onclick="fazerRequisicao('/agendamentos')" style="display: none;">Ver Agendamentos (Veterinário)</button>
            
            <!-- Novos botões para mostrar as seções -->
            <button id="btn-mostrar-cadastrar-pet" onclick="mostrarSecaoCadastrarPet()" style="display: none;">Cadastrar Novo Pet</button>
            <!-- Botão de agendar movido logicamente para o veterinário via JS -->
            <button id="btn-mostrar-agendar-consulta" onclick="mostrarSecaoAgendarConsulta()" style="display: none;">Agendar Nova Consulta</button>
            <button id="btn-mostrar-meus-pets" onclick="fazerRequisicao('/pets')" style="display: none;">Meus Pets</button>

            <button onclick="sair()" class="btn-danger">Sair</button>

            <!-- Seção de Cadastrar Pet (escondida por padrão) -->
            <div id="secao-cadastrar-pet" style="display: none;">
                <hr style="margin: 20px 0; border: 0.5px solid #333;">
                <h3>🐾 Cadastrar Novo Pet</h3>
                <input type="text" id="pet-nome" placeholder="Nome do Pet">
                <input type="text" id="pet-tipo" placeholder="Tipo (ex: Cachorro, Gato)">
                <input type="text" id="pet-raca" placeholder="Raça">
                <button onclick="cadastrarPet()" style="background-color: #f39c12;">Salvar Pet</button>
            </div>

            <!-- Seção de Agendar Consulta (escondida por padrão) -->
            <div id="secao-agendamento" style="display: none;">
                <hr style="margin: 20px 0; border: 0.5px solid #333;">
                <h3>📅 Agendar Nova Consulta</h3>

                <label for="agendamento-tutor">Selecione o Tutor:</label>
                <select id="agendamento-tutor" onchange="carregarPetsPorTutor(this.value)" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #444; background-color: #2d2d2d; color: #ffffff; border-radius: 4px;"></select>

                <label for="agendamento-pet">Selecione o Pet:</label>
                <select id="agendamento-pet" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #444; background-color: #2d2d2d; color: #ffffff; border-radius: 4px;"></select>
                
                <label for="agendamento-data">Data:</label>
                <input type="date" id="agendamento-data">
                
                <label for="agendamento-hora">Hora:</label>
                <input type="time" id="agendamento-hora">
                
                <button onclick="agendarConsulta()" style="background-color: #3498db;">Agendar Consulta</button>
            </div>
        </div>

        <!-- Seção para mostrar a resposta do servidor -->
        <div class="card">
            <h3>Resposta do Servidor:</h3>
            <div id="resultado"><div class="alert-info">Aguardando ação...</div></div>
        </div>
    </div>

    <script>
        const apiBaseUrl = 'http://localhost:3000';
        let currentUserRole = null; // Global variable to store user role

        // Função inteligente para formatar os dados visuais na tela
        function renderizarNaTela(data, titulo = null) {
            const div = document.getElementById('resultado');
            let conteudo = '';

            if (titulo) {
                conteudo += `<h4 style="margin-top:0; margin-bottom: 15px;">${titulo}</h4>`;
            }

            if (!data) {
                div.innerHTML = conteudo; return;
            }

            if (data.erro) {
                conteudo += `<div class="alert-error"><strong>Erro:</strong> ${data.erro}</div>`;
            } else if (data.token && data.role) { // Check for role as well
                conteudo += `<div class="alert-success">Login realizado com sucesso! ✅</div>`;
            } else if (data.msg) {
                conteudo += `<div class="alert-success">${data.msg}</div>`;
            } else if (Array.isArray(data)) {
                if (data.length === 0) {
                    conteudo += `<div class="alert-info">Nenhum registro encontrado.</div>`;
                } else {
                    data.forEach(item => {
                        conteudo += `<div class="item-card">`;
                        for (const [key, value] of Object.entries(item)) {
                            if (key !== 'id' && !key.endsWith('_id') && key !== 'senha') {
                                conteudo += `<div><strong>${key}:</strong> ${value}</div>`;
                            }
                        }
                        // Se for um agendamento pendente, mostra botões de ação
                        if (item.status === 'pendente') {
                            conteudo += `
                                <div style="margin-top: 10px;">
                                    <button onclick="atualizarStatusAgendamento('${item.id}', 'confirmado')" style="background-color: #2ecc71; padding: 5px 10px; font-size: 12px;">Confirmar</button>
                                    <button onclick="atualizarStatusAgendamento('${item.id}', 'cancelado')" style="background-color: #e74c3c; padding: 5px 10px; font-size: 12px;">Desmarcar</button>
                                </div>`;
                        }
                        conteudo += `</div>`;
                    });
                }
            } else if (typeof data === 'object') {
                conteudo += `<div class="item-card">`;
                for (const [key, value] of Object.entries(data)) {
                    if (key !== 'id' && key !== 'senha' && key !== 'token') {
                        conteudo += `<div><strong>${key}:</strong> ${value}</div>`;
                    }
                }
                conteudo += `</div>`;
            }
            div.innerHTML = conteudo;
        }

        function mostrarCadastro() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('register-section').style.display = 'block';
        }

        function mostrarLogin() {
            document.getElementById('register-section').style.display = 'none';
            document.getElementById('login-section').style.display = 'block';
        }

        async function fazerCadastro() {
            const nome = document.getElementById('reg-nome').value;
            const email = document.getElementById('reg-email').value;
            const telefone = document.getElementById('reg-telefone').value;
            const senha = document.getElementById('reg-senha').value;
            const role = document.getElementById('reg-role').value;

            const res = await fetch(`${apiBaseUrl}/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, email, telefone, senha, role })
            });

            const data = await res.json();

            if (data.id) {
                alert('Cadastro realizado com sucesso! Faça login.');
                mostrarLogin();
                renderizarNaTela({ msg: "Conta criada! Você já pode fazer login." });
            } else {
                renderizarNaTela(data, "Erro no Cadastro:");
            }
        }

        async function testarConexao() {
            const res = await fetch(`${apiBaseUrl}/servicos`);
            const data = await res.json();
            renderizarNaTela(data, "Conexão OK! Serviços no Banco:");
        }

        async function fazerLogin() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            const res = await fetch(`${apiBaseUrl}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, senha })
            });

            const data = await res.json();
            renderizarNaTela(data);

            if (data.token) {
                currentUserRole = data.role; // Store the role
                localStorage.setItem('token', data.token);
                localStorage.setItem('userRole', data.role); // Store role in localStorage
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('painel-section').style.display = 'block';
                updatePanelVisibility(data.role); // Update panel based on role
            }
        }

        function verMeuPerfil() {
            const role = localStorage.getItem('userRole');
            const endpoint = role === 'veterinario' ? '/veterinarios/me' : '/tutores/me';
            fazerRequisicao(endpoint);
        }

        function updatePanelVisibility(role) {
            // Hide all role-specific buttons first
            document.getElementById('btn-mostrar-cadastrar-pet').style.display = 'none';
            document.getElementById('btn-mostrar-agendar-consulta').style.display = 'none';
            document.getElementById('btn-mostrar-meus-pets').style.display = 'none';
            document.getElementById('btn-ver-agendamentos-tutor').style.display = 'none';
            document.getElementById('btn-ver-agendamentos-veterinario').style.display = 'none';
            
            // Hide all content sections
            document.getElementById('secao-cadastrar-pet').style.display = 'none';
            document.getElementById('secao-agendamento').style.display = 'none';

            if (role === 'tutor') {
                document.getElementById('btn-ver-agendamentos-tutor').style.display = 'block';
                document.getElementById('btn-mostrar-cadastrar-pet').style.display = 'block';
                document.getElementById('btn-mostrar-meus-pets').style.display = 'block';
            } else if (role === 'veterinario') {
                document.getElementById('btn-ver-agendamentos-veterinario').style.display = 'block';
                document.getElementById('btn-mostrar-agendar-consulta').style.display = 'block';
            }
        }

        // Novas funções para mostrar/esconder as seções
        function esconderTodasSecoesDeConteudo() {
            document.getElementById('secao-cadastrar-pet').style.display = 'none';
            document.getElementById('secao-agendamento').style.display = 'none';
            // Adicione aqui outras seções de conteúdo que você queira controlar
        }

        function mostrarSecaoCadastrarPet() {
            esconderTodasSecoesDeConteudo();
            document.getElementById('secao-cadastrar-pet').style.display = 'block';
        }

        function mostrarSecaoAgendarConsulta() {
            esconderTodasSecoesDeConteudo();
            document.getElementById('secao-agendamento').style.display = 'block';
            carregarTutores(); 
        }

        async function carregarTutores() {
            const token = localStorage.getItem('token');
            const res = await fetch(`${apiBaseUrl}/tutores`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const tutores = await res.json();
            const selectTutor = document.getElementById('agendamento-tutor');
            selectTutor.innerHTML = '<option value="">-- Selecione um Tutor --</option>';
            if (Array.isArray(tutores)) {
                tutores.forEach(tutor => {
                    const option = document.createElement('option');
                    option.value = tutor.id;
                    option.textContent = tutor.nome;
                    selectTutor.appendChild(option);
                });
            }
        }

        async function carregarPetsPorTutor(tutorId) {
            const token = localStorage.getItem('token');
            if (!tutorId) return document.getElementById('agendamento-pet').innerHTML = '';

            const res = await fetch(`${apiBaseUrl}/pets?tutor_id=${tutorId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const pets = await res.json();

            const selectPet = document.getElementById('agendamento-pet');
            selectPet.innerHTML = '<option value="">-- Selecione um Pet --</option>';
            if (Array.isArray(pets)) {
                pets.forEach(pet => {
                    const option = document.createElement('option');
                    option.value = pet.id;
                    option.textContent = pet.nome;
                    selectPet.appendChild(option);
                });
            }
        }

        async function fazerRequisicao(endpoint) {
            const token = localStorage.getItem('token');
            if (!token) return alert('Você precisa estar logado!');

            const res = await fetch(`${apiBaseUrl}${endpoint}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            const data = await res.json();
            let title = 'Resposta do Servidor:';
            if (endpoint === '/pets') title = 'Meus Pets:';
            else if (endpoint === '/tutores/me') title = 'Meu Perfil (Tutor):';
            else if (endpoint === '/veterinarios/me') title = 'Meu Perfil (Veterinário):';
            else if (endpoint === '/agendamentos') title = 'Meus Agendamentos:';

            renderizarNaTela(data, title);
        }

        async function agendarConsulta() {
            const token = localStorage.getItem('token');
            if (!token) return alert('Você precisa estar logado para agendar uma consulta!');

            const pet_id = document.getElementById('agendamento-pet').value;
            const data = document.getElementById('agendamento-data').value;
            const hora = document.getElementById('agendamento-hora').value;

            if (!pet_id || !data || !hora) {
                return renderizarNaTela({ erro: 'Por favor, selecione o pet, data e hora.' }, "Erro ao agendar consulta:");
            }

            const res = await fetch(`${apiBaseUrl}/agendamentos`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ pet_id, data, hora })
            });

            const result = await res.json();

            if (result.id) {
                renderizarNaTela(result, "Agendamento de Consulta:"); // Exibe a mensagem de sucesso
                fazerRequisicao('/agendamentos'); // Atualiza a lista de agendamentos
            } else {
                renderizarNaTela(result, "Erro ao agendar consulta:");
            }
        }
        async function cadastrarPet() {
            const token = localStorage.getItem('token');
            if (!token) return alert('Você precisa estar logado!');

            const nome = document.getElementById('pet-nome').value;
            const tipo = document.getElementById('pet-tipo').value;
            const raca = document.getElementById('pet-raca').value;

            if (!nome || !tipo) return alert('Por favor, preencha pelo menos o nome e o tipo do pet.');

            const res = await fetch(`${apiBaseUrl}/pets`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}` 
                },
                body: JSON.stringify({ nome, tipo, raca })
            });
            
            const data = await res.json();
            
            if (data.id) {
                document.getElementById('pet-nome').value = '';
                document.getElementById('pet-tipo').value = '';
                document.getElementById('pet-raca').value = '';
                fazerRequisicao('/pets'); // Atualiza a tela com a lista de pets automaticamente
            } else {
                renderizarNaTela(data, "Erro ao cadastrar Pet:");
            }
        }

        async function atualizarStatusAgendamento(id, novoStatus) {
            const token = localStorage.getItem('token');
            const res = await fetch(`${apiBaseUrl}/agendamentos/${id}/status`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ status: novoStatus })
            });

            const result = await res.json();
            if (result.msg) {
                alert(result.msg);
                fazerRequisicao('/agendamentos'); // Recarrega a lista
            } else {
                renderizarNaTela(result, "Erro ao atualizar status:");
            }
        }

        function sair() {
            localStorage.removeItem('token');
            document.getElementById('painel-section').style.display = 'none';
            esconderTodasSecoesDeConteudo(); // Esconde todas as seções de conteúdo ao sair
            document.getElementById('btn-ver-agendamentos-tutor').style.display = 'none'; // Hide on logout
            document.getElementById('btn-ver-agendamentos-veterinario').style.display = 'none'; // Hide on logout
            document.getElementById('login-section').style.display = 'block';
            renderizarNaTela({ msg: "Deslogado com sucesso. 👋" });
        }

        // Verifica se já tem um token salvo ao carregar a página
        if (localStorage.getItem('token')) {
            currentUserRole = localStorage.getItem('userRole'); // Retrieve role
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('painel-section').style.display = 'block';
            updatePanelVisibility(currentUserRole); // Update panel based on stored role
        }
    </script>
</body>
</html>
